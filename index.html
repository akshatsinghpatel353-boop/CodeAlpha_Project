
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONORA - Cinematic Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="sad">

    <div class="background-glow"></div>

    <!-- CINEMATIC ANIMATION -->
    <div id="cinematic" class="cinematic">

        <div class="storm-clouds"></div>

        <!-- Eagle -->
        <div class="eagle" id="eagle">
            <svg viewBox="0 0 500 220"
                 xmlns="http://www.w3.org/2000/svg">

                <path d="M250 112
                C210 85 165 30 15 8
                C65 70 105 125 190 142
                C125 125 75 145 35 180
                C125 168 190 155 235 135
                L250 155 L265 135
                C310 155 375 168 465 180
                C425 145 375 125 310 142
                C395 125 435 70 485 8
                C335 30 290 85 250 112Z"
                fill="#101827"
                stroke="#c4e8ff"
                stroke-width="3"/>

                <path d="M225 115 L250 170 L275 115
                L260 188 L250 205 L240 188Z"
                fill="#dbeafe"/>

                <path d="M250 115 L285 105 L265 130Z"
                fill="#fbbf24"/>

                <circle cx="265" cy="111" r="4" fill="#fff"/>
            </svg>

            <div class="eagle-trail"></div>
        </div>

        <!-- Lightning -->
        <div class="lightning lightning-one"></div>
        <div class="lightning lightning-two"></div>
        <div class="lightning lightning-three"></div>

        <div class="storm-flash"></div>

        <!-- Fire Explosion -->
        <div class="fire-explosion" id="explosion">
            <div class="fire-core"></div>
            <div class="fire-ring"></div>
            <div class="shockwave"></div>
        </div>

        <div class="cinematic-title" id="cinematicTitle">
            FEEL THE POWER
        </div>

        <div class="cinematic-progress">
            <div id="cinematicProgress"></div>
        </div>

    </div>


    <!-- MAIN PLAYER -->
    <main class="app">

        <header>

            <div>
                <h1>SONORA<span>.</span></h1>
                <p>FEEL EVERY FREQUENCY</p>
            </div>

            <div class="live">
                <span></span> LIVE EXPERIENCE
            </div>

        </header>


        <section class="player-card">

            <!-- Album Cover -->
            <div class="album">

                <div class="cover" id="cover">
                    <span>♫</span>
                </div>

            </div>


            <!-- Song Information -->
            <div class="song-info">

                <small id="moodLabel">SAD MODE</small>

                <h2 id="songTitle">
                    Midnight Memories
                </h2>

                <p id="artist">
                    Unknown Artist
                </p>

            </div>


            <!-- Audio Visualizer -->
            <canvas id="visualizer"></canvas>


            <!-- Progress Bar -->
            <div class="progress-area">

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <div class="time">

                    <span id="currentTime">0:00</span>

                    <span id="duration">0:00</span>

                </div>

            </div>


            <!-- Music Controls -->
            <div class="controls">

                <button id="prev" title="Previous">
                    ⏮
                </button>

                <button id="play" class="play-button" title="Play">
                    ▶
                </button>

                <button id="next" title="Next">
                    ⏭
                </button>

            </div>


            <!-- Volume -->
            <div class="volume">

                <span>🔊</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >

            </div>


            <!-- Mood Selection -->
            <div class="mood-section">

                <h3>CHOOSE YOUR MOOD</h3>

                <div class="mood-buttons">

                    <button
                        class="mood-btn active"
                        data-mood="sad">
                        🌧 Sad
                    </button>

                    <button
                        class="mood-btn"
                        data-mood="energetic">
                        ⚡ Energy
                    </button>

                    <button
                        class="mood-btn"
                        data-mood="romantic">
                        ❤️ Love
                    </button>

                </div>

            </div>


            <!-- Playlist -->
            <div class="playlist-heading">

                <h3>YOUR PLAYLIST</h3>

                <span id="songCount">
                    03 TRACKS
                </span>

            </div>

            <div id="playlist"></div>

        </section>


        <footer>
            MADE TO FEEL MUSIC • SONORA
        </footer>

    </main>


    <!-- AUDIO ELEMENT -->
    <audio id="audio" preload="metadata"></audio>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
